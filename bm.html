<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheTab.Ninja</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        
        /* Fix for mobile viewport issues */
        html {
            height: -webkit-fill-available;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-image: url('');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover; /* Välj 'cover' eller 'contain' */
            margin: 0;
            padding: 0;
            display: flex;
            transition: background-color 0.3s, color 0.3s;
            flex-direction: row;
            /* Use min-height instead of height for better mobile support */
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
        }
        
        /* Mobile viewport fix */
        @supports (-webkit-touch-callout: none) {
            body {
                min-height: -webkit-fill-available;
            }
        }
        
        /* Mobile responsiveness improvements */
        @media only screen and (max-width: 768px) {
            /* Disable zen mode on mobile */
            body.zen-mode {
                overflow-y: auto !important;
            }
            
            body.zen-mode #collections {
                margin-top: 0 !important;
                padding-top: 0 !important;
            }
            
            body.zen-mode #topBar {
                opacity: 1 !important;
                transform: translateY(0) !important;
                pointer-events: auto !important;
            }
            
            body.zen-mode .zen-datetime-display {
                display: none !important;
            }
            
            body.zen-mode #zenSearchContainer {
                display: none !important;
            }
            /* Force full height on mobile */
            html, body {
                height: 100%;
                height: -webkit-fill-available;
                min-height: 100%;
                min-height: -webkit-fill-available;
            }
            
            body {
                flex-direction: column;
            }
            
            /* Completely hide panes on mobile */
            #leftPane, #rightPane {
                display: none !important;
            }
            
            /* When panes are opened on mobile, show as overlay */
            #leftPane.open, #rightPane.open {
                display: flex !important;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                height: -webkit-fill-available;
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(10px);
                z-index: 9999;
            }
            
            /* Mobile bookmark manager takes full space */
            #bookmarkManager {
                flex: 1;
                min-height: 0;
                height: 100vh;
                height: -webkit-fill-available;
                display: flex;
                flex-direction: column;
            }
            
            /* Ensure collections area uses available space */
            #collections {
                flex: 1;
                overflow-y: auto;
                height: auto;
                min-height: 0;
                width: 100%;
                padding: 10px;
                box-sizing: border-box;
                margin: 0;
            }
            
            /* Make bookmarks more mobile-friendly */
            .bookmark {
                width: calc(50% - 10px);
                height: 90px;
            }
            
            
            /* Fix topBar layout on mobile - single row */
            #topBar {
                flex-direction: row;
                gap: 8px;
                padding: 8px;
                align-items: center;
                flex-shrink: 0;
                min-height: auto;
            }
            
            #topBar > div {
                display: flex;
                align-items: center;
            }
            
            /* Make collections take more space on mobile */
            #bookmarkManager {
                padding: 0;
                width: 100%;
            }
            
            /* Make sure search box doesn't take too much space */
            #searchBox {
                margin: 0 8px;
                height: 36px;
                font-size: 14px;
                flex: 1;
                min-width: 0;
            }
            
            /* Show mobile pane toggles only on mobile */
            .mobile-pane-toggle {
                display: flex !important;
            }
            
            /* Icon-only buttons on mobile */
            #addCollection {
                width: 40px;
                height: 40px;
                padding: 0;
                border-radius: 50%;
                font-size: 20px;
                font-weight: bold;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0;
            }
            
            #addCollection::before {
                content: "+";
            }
            
            /* Hide text in Add Collection button on mobile */
            #addCollection {
                text-indent: -9999px;
                overflow: hidden;
            }
            
            #supportButton {
                width: 40px;
                height: 40px;
                padding: 0;
                border-radius: 50%;
                margin: 0;
                text-decoration: none;
            }
            
            #supportButton .donation-text {
                display: none;
            }
            
            #supportButton .donation-icon {
                width: 20px;
                height: 20px;
                margin: 0;
            }
            
            /* Mobile pane toggle buttons */
            .mobile-pane-toggle {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background: rgba(240, 240, 240, 0.8);
                border: none;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 16px;
                margin: 0 4px;
                backdrop-filter: blur(8px);
                transition: all 0.3s ease;
            }
            
            .mobile-pane-toggle:hover {
                background: rgba(240, 240, 240, 1);
                transform: scale(1.1);
            }
            
            /* Dark mode for mobile toggle buttons */
            body.dark-mode .mobile-pane-toggle {
                background: rgba(60, 60, 60, 0.8);
                color: #e0e0e0;
            }
            
            body.dark-mode .mobile-pane-toggle:hover {
                background: rgba(80, 80, 80, 1);
            }
            
            /* Hide zen mode option on mobile */
            #zenMode {
                display: none;
            }
            
            /* Hide zen mode label on mobile */
            label:has(#zenMode) {
                display: none;
            }
            
            /* Ensure collections get maximum available height */
            #collections {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 5px;
                margin: 0;
            }
        }
        
        /* Specific fix for iOS Safari */
        @media only screen and (max-width: 768px) and (-webkit-min-device-pixel-ratio: 1) {
            body {
                height: 100vh;
                height: -webkit-fill-available;
            }
            
            #bookmarkManager {
                height: 100vh;
                height: -webkit-fill-available;
            }
        }

        /* Hide mobile pane toggles on desktop */
        .mobile-pane-toggle {
            display: none;
        }
        
        /* I zen mode behöver vi kunna scrolla */
        body.zen-mode {
            overflow-y: auto;
        }

        .bookmark .edit-icon,

        .bookmark .delete-icon {

        }
        .bookmark:hover .edit-icon,

        }
        .drag-handle {
            cursor: move;
            padding: 5px 10px;
            margin-right: 10px;
            background-color: #e0e0e0;
            border-radius: 4px;
            color: #333; /* Mörk färg för ljust läge */

        body.dark-mode .drag-handle {
            background-color: #444; /* Mörkare bakgrund för mörkt läge */
            color: #ddd; /* Ljusare text för mörkt läge */
        }
        .dragging {
            opacity: 0.3;

        .collection-actions {
            display: flex;

            transition: opacity 0.3s;

        .collection:hover .collection-actions {

        .collection-button {

            padding: 0 10px;

        }

        .collection.is-open .toggle-collection {

        .collection:not(.is-open) .toggle-collection {

        }

        body.zen-mode.scrolled #collections,

            padding-top: 74px; /* 20px (searchBox top) + 28px (searchBox height) + 16px (padding 8px*2) + 10px (space below) = 74px */
        }

        body.zen-mode #topBar {
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            /* pointer-events: none; REMOVED - så knappar fungerar i zen initial state */
        }

        body.zen-mode.scrolled #topBar,
        body.zen-mode.searching #topBar {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        body.zen-mode #searchBox {
            opacity: 0.8;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.zen-mode.searching #searchBox,
        body.zen-mode.scrolled #searchBox,
        body.zen-mode #searchBox:focus,
        body.zen-mode #searchBox:hover {

        }

        /* Smooth scroll behavior för bättre Zen upplevelse - disabled för att förhindra auto-hopp */
        html.zen-smooth-scroll {
            scroll-behavior: smooth;
        }

        /* Zen mode aktivering animation */
        body.zen-mode {
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Zen search container */
        #zenSearchContainer {
            display: none;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 500; /* Lägre än UI-element för att inte blockera interaktion */
            width: 100%;
            text-align: center;
        }

        body.zen-mode #zenSearchContainer {
            display: block;
        }

        /* Hide zen search when user is searching or has scrolled */
        body.zen-mode.searching #zenSearchContainer,
        body.zen-mode.scrolled #zenSearchContainer {
            display: none;
        }

        /* Zen initial search box */
        #zenSearchBox {
            padding: 12px 16px;
            width: min(500px, calc(100vw - 80px));
            height: 44px;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: rgba(0, 0, 0, 0.8);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        #zenSearchBox::placeholder {
            color: rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        #zenSearchBox:focus {
            background-color: rgba(255, 255, 255, 0.35);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            transform: scale(1.02);
        }

        /* Visually indicate zen search is "always ready" */
        body.zen-mode #zenSearchBox {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1),

        }

        body.dark-mode #zenSearchBox {

        }

        body.dark-mode #zenSearchBox::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        body.dark-mode #zenSearchBox:focus {
            background-color: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
        }

        body.dark-mode.zen-mode #zenSearchBox {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.1), 
                        0 0 0 1px rgba(255, 255, 255, 0.1);
